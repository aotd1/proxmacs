<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Proxmacs</title>
  <link rel="stylesheet" href="vendor/xterm.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <noscript><p class="noscript">Proxmacs needs JavaScript.</p></noscript>

  <div id="boot" class="boot"><div class="spinner"></div></div>

  <main id="login" class="login" hidden>
    <form id="login-form" class="login-card" autocomplete="on">
      <h1 class="brand-title"><span class="brand-mark" aria-hidden="true"></span>Proxmacs</h1>
      <label class="field">
        <span>Password</span>
        <input id="login-password" type="password" name="password" autocomplete="current-password" required>
      </label>
      <div id="login-error" class="login-error" role="alert"></div>
      <button id="login-submit" type="submit" class="btn primary block">Log in</button>
    </form>
  </main>

  <div id="app" hidden>
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span>Proxmacs</div>
      <div id="host-info" class="host-info"></div>
      <div class="spacer"></div>
      <span id="conn-status" class="badge err" hidden>Connection lost</span>
      <button id="task-indicator" type="button" class="task-indicator" title="Show task log"></button>
      <button id="create-vm" type="button" class="btn primary">Create VM</button>
      <button id="logout" type="button" class="btn">Log out</button>
    </header>

    <div class="main">
      <nav id="tree" class="tree-panel" aria-label="Resources"></nav>
      <section id="content" class="content"></section>
    </div>

    <section id="tasks-panel" class="tasks-panel">
      <div class="tasks-header">
        <button id="tasks-toggle" type="button" class="tasks-toggle" aria-expanded="true">
          <span class="chevron" aria-hidden="true"></span>Tasks
        </button>
        <span id="tasks-summary" class="muted"></span>
      </div>
      <div id="tasks-body" class="tasks-body"></div>
    </section>
  </div>

  <div id="modal-root"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="vendor/xterm.js"></script>
  <script src="vendor/addon-fit.js"></script>
  <script src="app.js"></script>
</body>
</html>
